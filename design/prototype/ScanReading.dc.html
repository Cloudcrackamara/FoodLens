<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FoodLens scan, reading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Open+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes fl-spin{to{transform:rotate(360deg)}}
@keyframes fl-scan{0%{top:6%}50%{top:88%}100%{top:6%}}
.fl-spin{animation:fl-spin .9s linear infinite}
.fl-scanline{animation:fl-scan 2.4s ease-in-out infinite}
@keyframes fl-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes fl-glow{0%,100%{box-shadow:0 0 0 0 rgba(255,196,47,0)}50%{box-shadow:0 0 22px 6px rgba(255,196,47,.55)}}
@keyframes fl-sweep{0%{top:4%;opacity:0}4%{opacity:1}18%{top:88%}32%{top:4%}42%{top:70%;opacity:1}46%{top:80%;opacity:0}100%{top:80%;opacity:0}}
@keyframes fl-pop{0%,44%{opacity:0;transform:rotate(-4deg) scale(.92)}50%,92%{opacity:1;transform:rotate(-4deg) scale(1)}100%{opacity:0;transform:rotate(-4deg) scale(1)}}
@keyframes fl-sheet{0%,46%{opacity:0;transform:rotate(-4deg) translateY(14%)}54%,92%{opacity:1;transform:rotate(-4deg) translateY(0)}100%{opacity:0;transform:rotate(-4deg) translateY(0)}}
@keyframes fl-batch{0%,54%{opacity:0;transform:translateX(-8%)}62%,92%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes fl-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fl-breathe{animation:fl-breathe 4s ease-in-out infinite}
.fl-glow{animation:fl-glow 1.8s ease-in-out infinite}
.fl-sweep{animation:fl-sweep 6.5s ease-in-out infinite}
.fl-pop{animation:fl-pop 6.5s ease-out infinite}
.fl-sheet{animation:fl-sheet 6.5s cubic-bezier(.2,.8,.2,1) infinite}
.fl-batch{animation:fl-batch 6.5s cubic-bezier(.2,.8,.2,1) infinite}
.fl-blink{animation:fl-blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.fl-spin,.fl-scanline,.fl-breathe,.fl-glow,.fl-blink{animation:none}.fl-sweep{display:none}.fl-pop,.fl-sheet,.fl-batch{animation:none;opacity:1}}
</style>
</helmet>
<div style="width: 100%">
<dc-import name="Scan" variant="reading" hint-size="100%,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
