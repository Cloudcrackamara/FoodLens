[project]
name = "foodlens-backend"
version = "0.1.0"
description = "FoodLens API: simulated product/batch lookup and demo-reviewed sourcing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations: long constraint names and SQL strings.
"alembic/versions/*" = ["E501"]
# One row per documented lookup case; wrapping makes the table harder to read.
"app/demo_data.py" = ["E501"]
